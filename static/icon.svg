<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
	<!-- Source for every app icon; run `npm run icons` after editing. Shapes stay
	     inside the central 80% circle so the maskable crop keeps them whole. -->
	<defs>
		<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#4f46e5" />
			<stop offset="1" stop-color="#0ea5e9" />
		</linearGradient>
		<linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#fff" stop-opacity="0.9" />
			<stop offset="1" stop-color="#fff" stop-opacity="0.15" />
		</linearGradient>
	</defs>
	<rect id="background" width="512" height="512" fill="url(#bg)" />
	<g transform="translate(-24 6)">
		<!-- Vertical strip of panels, the last one fading out as if scrolling on. -->
		<rect x="160" y="104" width="168" height="100" rx="16" fill="#fff" />
		<rect x="160" y="216" width="78" height="104" rx="16" fill="#fff" />
		<rect x="250" y="216" width="78" height="104" rx="16" fill="#fff" />
		<rect x="160" y="332" width="168" height="80" rx="16" fill="url(#fade)" />
		<!-- Speech bubble overlapping the first panel. -->
		<path
			d="M318 92c-44 0-78 25-78 58 0 18 10 33 27 44l-9 30 34-20c8 2 17 3 26 3 44 0 78-25 78-57s-34-58-78-58z"
			fill="#facc15"
			stroke="#1e1b4b"
			stroke-width="10"
			stroke-linejoin="round"
		/>
		<circle cx="288" cy="150" r="10" fill="#1e1b4b" />
		<circle cx="318" cy="150" r="10" fill="#1e1b4b" />
		<circle cx="348" cy="150" r="10" fill="#1e1b4b" />
	</g>
</svg>
